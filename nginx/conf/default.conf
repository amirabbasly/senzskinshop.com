# ============================================================
#  SENZ SKIN SHOP — nginx reverse proxy
#  web  → Next.js  (senz_web:3000)
#  api  → Node API (senz_api:4000)  for /api and /uploads
# ============================================================

upstream senz_web {
  server web:3000;
  keepalive 32;
}

upstream senz_api {
  server api:4000;
  keepalive 16;
}

# ---------- HTTP ----------
server {
  listen 80;
  listen [::]:80;
  server_name senzskinshop.com www.senzskinshop.com _;

  client_max_body_size 12m;
  server_tokens off;

  # Let's Encrypt HTTP-01 challenges (see README → SSL)
  location /.well-known/acme-challenge/ {
    root /var/www/acme;
  }

  # Uncomment after the certificate is issued to force HTTPS:
  # location / { return 301 https://$host$request_uri; }

  include /etc/nginx/conf.d/senz-app.inc;
}

